<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Form Validator</title>
</head>

<body>
    <div class="container">
        <form action="" id="form" class="form" novalidate>
            <h2>Register With Us</h2>
            <div class="form-control">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" aria-describedby="username-error">
                <span id="username-error" class="error-message"></span>
            </div>
            <div class="form-control">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email" aria-describedby="email-error">
                <span id="email-error" class="error-message">Error Message</span>
            </div>
            <div class="form-control">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" aria-describedby="password-error">
                <span id="password-error" class="error-message"></span>
            </div>
            <div class="form-control">
                <label for="password2">Confirm Password</label>
                <input type="password" id="password2" placeholder="Enter password again"
                    aria-describedby="password2-error">
                <span id="password2-error" class="error-message"></span>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>

</html>
